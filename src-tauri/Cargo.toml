[package]
name = "pix"
version = "0.1.0"
description = "Turn hand-drawn or imported tiles into Tiled-ready tilesets"
license = "GPL-3.0-only"
edition = "2021"

[lib]
name = "pix_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
